[package]
name = "md2pdf"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Render Markdown to PDF with correct color-emoji rendering."
authors = ["md2pdf contributors"]
repository = "https://github.com/eshork/md2pdf"
readme = "README.md"

[[bin]]
name = "md2pdf"
path = "src/main.rs"

[lib]
name = "md2pdf"
path = "src/lib.rs"

# Engine choice: hand-rolled `typst::World` (see `src/pipeline/world.rs`)
# over `typst` + `typst-pdf`. typst-as-lib was surveyed and rejected for
# v1 — the World surface we need (one in-memory main source, no
# `@preview` packages) is small enough to maintain in-tree, and avoiding
# typst-as-lib keeps optional features (reqwest, ureq) out of the dep
# graph entirely.
[dependencies]
# Dependencies for md2pdf v1 are pinned per Decision D-c3af71.
# See that Decision for parser, image-pipeline, and mermaid choices and rationale.
clap = { version = "=4.5.20", features = ["derive"] }
typst = "=0.14.2"
typst-pdf = "=0.14.2"
# Bundled default fonts (New Computer Modern, DejaVu Sans Mono, etc.) so
# the World can actually shape body text. Without this, the World only
# carries Twemoji (emoji-only) and every Latin glyph falls back to
# .notdef — Typst still "compiles" but the PDF content stream comes out
# empty (blank page). Pinned to lock-file version.
typst-assets = { version = "=0.14.2", features = ["fonts"] }
thiserror = "=2.0.18"
pulldown-cmark = { version = "=0.13.0", default-features = false }
ecow = "=0.3.0"
petgraph = { version = "=0.6.5", default-features = false, features = ["graphmap"] }
svg = "=0.18.0"
# ureq: HTTP client for remote image fetch in image_pipeline.
# rustls + webpki-roots only (no OpenSSL) — keeps the no-Chromium /
# minimal-system-deps Vision posture intact.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
# image: PNG/JPEG decode + intrinsic-pixel-dimension extraction for
# image_pipeline. SVG passthrough is handled by Typst (resvg), so we do
# NOT enable any SVG features here.
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }
# url: parse + classify image src URLs (file://, http(s)://, relative).
url = "=2.5.4"

[dev-dependencies]
assert_cmd = "=2.2.2"
tempfile = "=3.16.0"
# Re-used in the emitter integration test (tests/emitter_smoke.rs) to
# build a tiny valid 1×1 PNG fixture that Typst's strict decoder will
# accept. Kept on the same pinned version as the production dep.
image = { version = "=0.25.6", default-features = false, features = ["png"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
